[package]
name = "clistream"
version = "1.2.0"
edition = "2024"
description = "Offline-first terminal audio library for YouTube (Rust + daemon + TUI)"
license = "MIT"
authors = ["Nicolai"]
repository = "https://github.com/evelynadriaan/ruststream-cli"

[dependencies]
# CLI
clap = { version = "4", features = ["derive", "env"] }

# Database
rusqlite = { version = "0.32", features = ["bundled", "uuid"] }

# Audio playback
rodio = "0.20"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# IDs and time
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Fuzzy search
fuzzy-matcher = "0.3"

# TUI
ratatui = "0.29"
crossterm = "0.28"

# Utilities
dirs = "6"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = { version = "2", features = ["json"] }

# IPC
interprocess = "2"

# Media controls (system media keys)
souvlaki = "0.7"
discord-rich-presence = "0.2"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[[bin]]
name = "clistream"
path = "src/main.rs"
